<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Manager Grid View — Bookmark Manager+</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

html, body { margin:0; padding:0; height:100%; background:#1a1a2e; display:flex; align-items:center; justify-content:center; }

:root {
  --yellow: #F5DF4D; --yellow-hover: #E8D340; --yellow-light: #FDF8D4;
  --yellow-glow: rgba(245,223,77,0.25); --gray: #939597; --gray-dark: #6B6D6F;
  --gray-light: #C8C9CB; --gray-subtle: #E8E8EA;
  --bg-primary: #FFFFFF; --bg-secondary: #F7F7F8; --bg-sidebar: #F0F0F2;
  --text-primary: #333333; --text-secondary: #666666; --text-muted: #999999;
  --accent: #F5DF4D; --accent-text: #B8A200;
  --border: #E0E0E2; --border-light: #ECECEE;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --radius-pill: 50px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  --shadow-card: 0 2px 8px rgba(0,0,0,0.05);
}

* { margin:0; padding:0; box-sizing:border-box; }

.device-frame {
  width: 960px; height: 620px;
  border-radius: 16px; overflow: hidden;
  box-shadow: 0 30px 100px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
  font-family: 'Montserrat', -apple-system, sans-serif;
  font-size: 13px; color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
  background: var(--bg-primary);
  position: relative;
}

.screenshot-label {
  position:absolute; top:-36px; left:50%; transform:translateX(-50%);
  font-family:'Montserrat',sans-serif; font-size:13px; font-weight:600;
  color:rgba(255,255,255,0.6); white-space:nowrap;
}

/* Header */
.header {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px; position:relative; z-index:1;
  background:linear-gradient(135deg, var(--yellow-light) 0%, var(--bg-secondary) 60%, var(--bg-primary) 100%);
  gap:16px;
}
.header::before {
  content:''; position:absolute; top:0;left:0;right:0;bottom:0;
  pointer-events:none; z-index:0; opacity:0.04;
  background-image:
    radial-gradient(circle,var(--gray) 1px,transparent 1px),
    linear-gradient(0deg,transparent 48%,var(--gray) 49%,var(--gray) 51%,transparent 52%),
    linear-gradient(90deg,transparent 48%,var(--gray) 49%,var(--gray) 51%,transparent 52%);
  background-size:24px 24px,48px 48px,48px 48px;
}
.header-brand { display:flex; align-items:center; gap:8px; z-index:1; }
.brand-icon { display:flex; align-items:center; justify-content:center; width:34px; height:34px; background:var(--yellow); border-radius:var(--radius-sm); box-shadow:0 4px 20px rgba(245,223,77,0.3); }
h1 { font-size:17px; font-weight:700; letter-spacing:-0.03em; white-space:nowrap; }
.accent-plus { color:var(--yellow-hover); font-weight:800; }
.header-actions { display:flex; align-items:center; gap:10px; flex:1; z-index:1; }

.search-wrapper { position:relative; flex:1; }
.search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--gray); }
.search-input { width:100%; padding:9px 12px 9px 36px; border:1px solid var(--border); border-radius:var(--radius-pill); font-family:inherit; font-size:13px; font-weight:500; background:var(--bg-primary); color:var(--text-primary); outline:none; }

.view-toggle { display:flex; border:1px solid var(--border); border-radius:var(--radius-pill); overflow:hidden; background:var(--bg-primary); }
.btn-view { display:flex; align-items:center; justify-content:center; width:32px; height:28px; border:none; background:transparent; color:var(--gray); }
.btn-view:first-child { border-right:1px solid var(--border); }
.btn-view.active { background:var(--yellow); color:var(--text-primary); }

.dock-selector-inline { display:flex; align-items:center; gap:3px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:var(--radius-pill); padding:3px; }
.dock-btn { display:flex; align-items:center; justify-content:center; width:26px; height:22px; border:none; border-radius:var(--radius-pill); background:transparent; color:var(--gray); }
.dock-btn.active { background:var(--yellow); color:var(--text-primary); box-shadow:0 1px 4px rgba(245,223,77,0.4); }

.wave-divider { line-height:0; }
.wave-divider svg { display:block; width:100%; height:14px; }

.layout { display:flex; flex:1; overflow:hidden; }

/* Sidebar */
.sidebar { width:230px; min-width:230px; background:var(--bg-sidebar); border-right:1px solid var(--border-light); display:flex; flex-direction:column; }
.sidebar-header { display:flex; align-items:center; gap:6px; padding:14px 16px 10px; font-size:11px; font-weight:700; color:var(--gray); text-transform:uppercase; letter-spacing:0.8px; }
.sidebar-folder { display:flex; align-items:center; gap:8px; padding:7px 12px; font-size:13px; font-weight:500; color:var(--text-secondary); border-left:3px solid transparent; }
.sidebar-folder.active { background:rgba(245,223,77,0.15); color:var(--text-primary); border-left-color:var(--yellow); font-weight:600; }
.sidebar-folder.indent1 { padding-left:28px; }
.folder-svg { flex-shrink:0; }
.btn-sidebar { margin:8px 12px 14px; padding:8px 12px; border:1px dashed var(--gray-light); border-radius:var(--radius-pill); background:transparent; color:var(--gray); font-family:inherit; font-size:12px; font-weight:500; text-align:center; }

/* Main */
.main-content { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.breadcrumb { padding:10px 20px; font-size:12px; font-weight:500; color:var(--text-secondary); border-bottom:1px solid var(--border-light); display:flex; align-items:center; gap:4px; }
.breadcrumb-link { color:var(--accent-text); font-weight:600; }
.breadcrumb-sep { color:var(--gray-light); }
.breadcrumb-current { color:var(--text-primary); font-weight:600; }

/* Grid */
.grid-container {
  flex:1; overflow-y:auto; padding:18px;
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap:14px;
  align-content: start;
}

.grid-item {
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:18px 10px; border-radius:var(--radius-lg);
  text-align:center;
  border:1px solid var(--border-light);
  background:var(--bg-primary);
  box-shadow:var(--shadow-sm);
  transition: all 180ms ease;
}
.grid-item.hovered {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: var(--yellow);
}
.grid-item .grid-icon { display:flex; align-items:center; justify-content:center; }
.grid-item .grid-favicon { width:32px; height:32px; border-radius:6px; }
.grid-item .grid-title { font-size:12px; font-weight:500; line-height:1.3; max-width:100%; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.grid-item .grid-count { font-size:10px; color:var(--gray); font-weight:600; background:var(--gray-subtle); padding:1px 8px; border-radius:var(--radius-pill); }
</style>
</head>
<body>
<div style="position:relative;">
  <div class="screenshot-label">Manager — Grid View</div>
  <div class="device-frame">
    <!-- Header -->
    <div class="header">
      <div class="header-brand">
        <span class="brand-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg></span>
        <h1>Bookmark Manager<span class="accent-plus">+</span></h1>
      </div>
      <div class="header-actions">
        <div class="search-wrapper">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>

        <div class="view-toggle">

          <div class="btn-view active"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M1 1h6v6H1zm8 0h6v6H9zM1 9h6v6H1zm8 0h6v6H9z"/></svg></div>
        </div>
        <div class="dock-selector-inline">
          <div class="dock-btn active"><svg width="14" height="14" viewBox="0 0 16 16"><rect x="0" y="1" width="5" height="14" rx="1" fill="currentColor"/><rect x="7" y="1" width="9" height="14" rx="1" fill="currentColor" opacity="0.2"/></svg></div>
          <div class="dock-btn"><svg width="14" height="14" viewBox="0 0 16 16"><rect x="1" y="0" width="14" height="5" rx="1" fill="currentColor"/><rect x="1" y="7" width="14" height="9" rx="1" fill="currentColor" opacity="0.2"/></svg></div>

          <div class="dock-btn"><svg width="14" height="14" viewBox="0 0 16 16"><rect x="0" y="1" width="9" height="14" rx="1" fill="currentColor" opacity="0.2"/><rect x="11" y="1" width="5" height="14" rx="1" fill="currentColor"/></svg></div>
        </div>
      </div>
    </div>

    <div class="wave-divider"><svg viewBox="0 0 1200 14" preserveAspectRatio="none"><path d="M0,7 C150,0 300,14 600,7 C900,0 1050,14 1200,7 L1200,14 L0,14 Z" fill="#fff"/></svg></div>

    <div class="layout">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8l-2-2z"/></svg>
          フォルダ
        </div>
        <div class="sidebar-folder active">
          <svg class="folder-svg" width="14" height="14" viewBox="0 0 24 24" fill="#F5DF4D"><path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8l-2-2z"/></svg>
          <span>仕事</span>
        </div>
        <div class="sidebar-folder indent1">
          <svg class="folder-svg" width="14" height="14" viewBox="0 0 24 24" fill="#F5DF4D"><path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8l-2-2z"/></svg>
          <span>ドキュメント</span>
        </div>
        <div class="sidebar-folder">
          <svg class="folder-svg" width="14" height="14" viewBox="0 0 24 24" fill="#F5DF4D"><path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8l-2-2z"/></svg>
          <span>ブックマークバー</span>
        </div>
        <div class="sidebar-folder">
          <svg class="folder-svg" width="14" height="14" viewBox="0 0 24 24" fill="#F5DF4D"><path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8l-2-2z"/></svg>
          <span>個人プロジェクト</span>
        </div>
        <div class="sidebar-folder">
          <svg class="folder-svg" width="14" height="14" viewBox="0 0 24 24" fill="#F5DF4D"><path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8l-2-2z"/></svg>

        <div style="flex:1;"></div>
        <div class="btn-sidebar">+ 新しいフォルダ</div>

      <div class="main-content">

        <div class="grid-container">

            <img class="grid-favicon" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%234285F4'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='14' font-weight='bold' font-family='Arial'>D</text></svg>">
            <div class="grid-title">Google Drive</div>

          <div class="grid-item">

            <div class="grid-title">Notion</div>
          </div>
          <div class="grid-item">
            <img class="grid-favicon" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%234A154B'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='14' font-weight='bold' font-family='Arial'>S</text></svg>">
            <div class="grid-title">Slack</div>
          </div>
          <div class="grid-item">
            <img class="grid-favicon" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230052CC'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='12' font-weight='bold' font-family='Arial'>J</text></svg>">
            <div class="grid-title">Jira - Project Board</div>
          </div>
          <div class="grid-item">
            <img class="grid-favicon" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23F24E1E'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='14' font-weight='bold' font-family='Arial'>F</text></svg>">
            <div class="grid-title">Figma</div>
