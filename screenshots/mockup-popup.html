<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Popup Mockup — Bookmark Manager+</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

/* ===== Page wrapper (dark background for contrast) ===== */
html, body { margin:0; padding:0; height:100%; background:#1a1a2e; display:flex; align-items:center; justify-content:center; }

.device-frame {
  width: 400px;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 25px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
  position: relative;
}

/* ===== Extension Variables ===== */
:root {
  --yellow: #F5DF4D;
  --yellow-hover: #E8D340;
  --yellow-light: #FDF8D4;
  --yellow-glow: rgba(245, 223, 77, 0.25);
  --gray: #939597;
  --gray-dark: #6B6D6F;
  --gray-light: #C8C9CB;
  --gray-subtle: #E8E8EA;
  --bg-primary: #FFFFFF;
  --bg-secondary: #F7F7F8;
  --text-primary: #333333;
  --text-secondary: #666666;
  --text-muted: #999999;
  --accent: #F5DF4D;
  --accent-text: #B8A200;
  --border: #E0E0E2;
  --border-light: #ECECEE;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-pill: 50px;
  --shadow-card: 0 2px 8px rgba(0,0,0,0.05);
  --transition: 180ms ease;
}

* { margin:0; padding:0; box-sizing:border-box; }

.popup {
  width: 400px;
  font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 13px;
  color: var(--text-primary);
  background: linear-gradient(180deg, var(--yellow-light) 0%, var(--bg-primary) 22%);
  position: relative;
  -webkit-font-smoothing: antialiased;
}

/* Circuit overlay */
.popup::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 110px;
  pointer-events: none;
  z-index: 0;
  opacity: 0.05;
  background-image:
    radial-gradient(circle, var(--gray) 1px, transparent 1px),
    linear-gradient(0deg, transparent 48%, var(--gray) 49%, var(--gray) 51%, transparent 52%),
    linear-gradient(90deg, transparent 48%, var(--gray) 49%, var(--gray) 51%, transparent 52%);
  background-size: 24px 24px, 48px 48px, 48px 48px;
  background-position: 0 0, 12px 12px, 12px 12px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 10px;
  position: relative;
  z-index: 1;
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px; height: 32px;
  background: var(--yellow);
  border-radius: var(--radius-sm);
  box-shadow: 0 4px 20px rgba(245,223,77,0.3);
}

h1 { font-size:15px; font-weight:700; letter-spacing:-0.03em; }
.accent-plus { color: var(--yellow-hover); font-weight:800; }

.btn-icon {
  display:flex; align-items:center; justify-content:center;
  width:30px; height:30px;
  border:1px solid var(--border); border-radius:50%;
  background: var(--bg-primary); color: var(--gray);
}

/* Dock selector */
.dock-selector {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px 8px;
  position: relative;
  z-index: 1;
}

.dock-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.dock-positions {
  display: flex;
  align-items: center;
  gap: 3px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 3px;
}

.dock-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px; height: 24px;
  border: none;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--gray);
}

.dock-btn.active {
  background: var(--yellow);
  color: var(--text-primary);
  box-shadow: 0 1px 4px rgba(245,223,77,0.4);
}

/* Wave */
.wave-divider {
  position: relative;
  z-index: 1;
  margin-top: -1px;
  line-height: 0;
}
.wave-divider svg { display:block; width:100%; height:12px; }

/* Search */
.search-bar {
  padding: 10px 16px;
  position: relative;
  z-index: 1;
}
.search-wrapper { position: relative; }
.search-icon {
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--gray);
}
.search-bar input {
  width: 100%;
  padding: 9px 12px 9px 36px;
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  background: var(--bg-primary);
  color: var(--text-primary);
  outline: none;
}

/* Bookmark items */
.bookmark-tree { padding: 4px 8px; }

.bookmark-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
}
.bookmark-item:hover, .bookmark-item.hovered {
  background: rgba(147,149,151,0.08);
  border-color: var(--border-light);
  box-shadow: var(--shadow-card);
}

.folder-toggle { font-size:9px; color:var(--gray); width:14px; text-align:center; }
.folder-icon { display:flex; align-items:center; flex-shrink:0; }
.favicon { width:16px; height:16px; border-radius:3px; flex-shrink:0; }
.bookmark-info { display:flex; flex-direction:column; gap:2px; overflow:hidden; min-width:0; }
.bookmark-title { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bookmark-url { font-size:11px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:400; }
.item-count { font-size:11px; color:var(--gray); margin-left:auto; background:var(--gray-subtle); padding:1px 7px; border-radius:50px; font-weight:600; }

.tree-folder {}
.tree-children { padding-left: 20px; }
.tree-children.collapsed { display:none; }

/* Footer */
.popup-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border-light);
  background: var(--bg-secondary);
}
.btn-primary {
  display:block; width:100%;
  padding: 10px 20px;
  background: var(--yellow);
  color: var(--text-primary);
  border: none;
  border-radius: var(--radius-pill);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  letter-spacing: -0.01em;
}

/* Badge label */
.screenshot-label {
  position: absolute;
  top: -36px; left: 50%;
  transform: translateX(-50%);
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: rgba(255,255,255,0.6);
  white-space: nowrap;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>
<div style="position:relative;">
  <div class="screenshot-label">Popup View</div>
  <div class="device-frame">
    <div class="popup">
      <!-- Header -->
      <div class="header">
        <div class="header-brand">
          <span class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
          </span>
          <h1>Bookmark Manager<span class="accent-plus">+</span></h1>
        </div>
        <div class="btn-icon">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="#939597"><path d="M2 2h5v1H3v10h10V8h1v5a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1zm7 0h5v5h-1V3.7L8.35 8.35l-.7-.7L12.29 3H9V2z"/></svg>
        </div>
      </div>

      <!-- Dock Selector -->
      <div class="dock-selector">
        <span class="dock-label">配置:</span>
        <div class="dock-positions">
          <div class="dock-btn" title="左"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="0" y="1" width="5" height="14" rx="1" fill="currentColor"/><rect x="7" y="1" width="9" height="14" rx="1" fill="currentColor" opacity="0.2"/></svg></div>
          <div class="dock-btn" title="上"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="0" width="14" height="5" rx="1" fill="currentColor"/><rect x="1" y="7" width="14" height="9" rx="1" fill="currentColor" opacity="0.2"/></svg></div>
          <div class="dock-btn active" title="中央"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1" fill="currentColor"/><rect x="0" y="0" width="16" height="16" rx="1" fill="currentColor" opacity="0.1"/></svg></div>
          <div class="dock-btn" title="下"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="0" width="14" height="9" rx="1" fill="currentColor" opacity="0.2"/><rect x="1" y="11" width="14" height="5" rx="1" fill="currentColor"/></svg></div>
          <div class="dock-btn" title="右"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="0" y="1" width="9" height="14" rx="1" fill="currentColor" opacity="0.2"/><rect x="11" y="1" width="5" height="14" rx="1" fill="currentColor"/></svg></div>
        </div>
      </div>

      <!-- Wave -->
      <div class="wave-divider">
        <svg viewBox="0 0 400 12" preserveAspectRatio="none">
          <path d="M0,6 C60,0 120,12 200,6 C280,0 340,12 400,6 L400,12 L0,12 Z" fill="#fff"/>
        </svg>
      </div>

      <!-- Search -->
      <div class="search-bar">
        <div class="search-wrapper">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" placeholder="ブックマークを検索..." readonly>
        </div>
      </div>

      <!-- Bookmark Tree -->
      <div class="bookmark-tree">
        <!-- Folder: ブックマークバー (open) -->
        <div class="tree-folder">
          <div class="bookmark-item folder">
            <span class="folder-toggle">&#9660;</span>
            <span class="folder-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="#F5DF4D" stroke="none"><path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8l-2-2z"/></svg></span>
            <span class="bookmark-title">ブックマークバー</span>
            <span class="item-count">5</span>
          </div>
          <div class="tree-children">
            <div class="bookmark-item hovered">
              <img class="favicon" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%234285F4'/><text x='8' y='12' text-anchor='middle' fill='white' font-size='11' font-family='Arial'>G</text></svg>">
              <div class="bookmark-info">
                <span class="bookmark-title">Google</span>
                <span class="bookmark-url">https://www.google.com</span>
              </div>
            </div>
            <div class="bookmark-item">
              <img class="favicon" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23333'/><text x='8' y='12' text-anchor='middle' fill='white' font-size='11' font-family='Arial'>G</text></svg>">
              <div class="bookmark-info">
                <span class="bookmark-title">GitHub</span>
                <span class="bookmark-url">https://github.com</span>
              </div>
            </div>
            <div class="bookmark-item">
              <img class="favicon" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23FF6600'/><text x='8' y='12' text-anchor='middle' fill='white' font-size='10' font-family='Arial'>Y</text></svg>">
              <div class="bookmark-info">
                <span class="bookmark-title">Hacker News</span>
                <span class="bookmark-url">https://news.ycombinator.com</span>
              </div>
            </div>

            <!-- Sub folder -->
            <div class="tree-folder">
              <div class="bookmark-item folder">
                <span class="folder-toggle">&#9654;</span>
                <span class="folder-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="#F5DF4D" stroke="none"><path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8l-2-2z"/></svg></span>
                <span class="bookmark-title">デザインリソース</span>
                <span class="item-count">3</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Folder: 仕事 (closed) -->
        <div class="tree-folder">
          <div class="bookmark-item folder">
            <span class="folder-toggle">&#9654;</span>
            <span class="folder-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="#F5DF4D" stroke="none"><path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8l-2-2z"/></svg></span>
            <span class="bookmark-title">仕事</span>
            <span class="item-count">12</span>
          </div>
        </div>

        <!-- Folder: 個人 (closed) -->
        <div class="tree-folder">
          <div class="bookmark-item folder">
            <span class="folder-toggle">&#9654;</span>
            <span class="folder-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="#F5DF4D" stroke="none"><path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8l-2-2z"/></svg></span>
            <span class="bookmark-title">個人プロジェクト</span>
            <span class="item-count">8</span>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="popup-footer">
        <div class="btn-primary">+ 現在のページを追加</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
