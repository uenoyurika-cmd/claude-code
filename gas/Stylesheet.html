<style>
  :root {
    --primary: #1a73e8;
    --primary-hover: #1557b0;
    --bg: #f8f9fa;
    --card-bg: #ffffff;
    --text: #202124;
    --text-secondary: #5f6368;
    --border: #dadce0;
    --success: #0d904f;
    --error: #d93025;
    --warning: #f9ab00;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Google Sans', 'Noto Sans JP', sans-serif;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
  }

  .header h1 {
    font-size: 24px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 8px;
  }

  .header p {
    font-size: 14px;
    color: var(--text-secondary);
  }

  .card {
    background: var(--card-bg);
    border-radius: 8px;
    border: 1px solid var(--border);
    padding: 24px;
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 6px;
    color: var(--text);
  }

  .form-group .hint {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .form-group input[type="text"],
  .form-group textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  .form-group input[type="text"]:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
  }

  .form-group textarea {
    min-height: 100px;
    resize: vertical;
  }

  .checkbox-group {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .checkbox-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .checkbox-item input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  .checkbox-item label {
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 0;
  }

  .image-upload-area {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background-color 0.2s;
  }

  .image-upload-area:hover {
    border-color: var(--primary);
    background-color: rgba(26, 115, 232, 0.04);
  }

  .image-upload-area.dragover {
    border-color: var(--primary);
    background-color: rgba(26, 115, 232, 0.08);
  }

  .image-upload-area p {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 8px;
  }

  .image-upload-area .icon {
    font-size: 32px;
    color: var(--text-secondary);
  }

  .image-preview-container {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  .image-preview {
    position: relative;
    width: 120px;
    height: 80px;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .image-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .image-preview .remove-btn {
    position: absolute;
    top: 2px;
    right: 2px;
    background: rgba(0, 0, 0, 0.6);
    color: white;
    border: none;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 24px;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.2s;
    font-family: inherit;
  }

  .btn-primary {
    background-color: var(--primary);
    color: white;
  }

  .btn-primary:hover {
    background-color: var(--primary-hover);
  }

  .btn-primary:disabled {
    background-color: var(--border);
    cursor: not-allowed;
  }

  .btn-secondary {
    background-color: white;
    color: var(--primary);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    background-color: var(--bg);
  }

  .btn-group {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 24px;
  }

  .loading-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255, 255, 255, 0.9);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }

  .loading-overlay.active {
    display: flex;
  }

  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    margin-top: 16px;
    font-size: 14px;
    color: var(--text-secondary);
  }

  .result-section {
    display: none;
  }

  .result-section.active {
    display: block;
  }

  .result-success {
    background: #e6f4ea;
    border: 1px solid var(--success);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
  }

  .result-success a {
    color: var(--primary);
    font-weight: 500;
    text-decoration: none;
  }

  .result-success a:hover {
    text-decoration: underline;
  }

  .result-error {
    background: #fce8e6;
    border: 1px solid var(--error);
    border-radius: 8px;
    padding: 16px;
    color: var(--error);
  }

  .preview-section {
    display: none;
  }

  .preview-section.active {
    display: block;
  }

  .preview-item {
    margin-bottom: 12px;
  }

  .preview-item h4 {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }

  .preview-item pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px;
    font-size: 13px;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-family: 'Noto Sans JP', sans-serif;
  }

  @media (max-width: 600px) {
    .container {
      padding: 16px 8px;
    }

    .checkbox-group {
      flex-direction: column;
    }

    .btn-group {
      flex-direction: column;
    }

    .btn {
      width: 100%;
    }
  }
</style>
