<script>
  // 画像データ格納用
  let scheduleImages = [];
  let designRefImageA = null;
  let designRefImageB = null;

  /**
   * 初期化
   */
  function init() {
    initImageUpload();
    updateNavDots();
    updateStatusPanel();
  }

  /**
   * 画像アップロードエリアの初期化
   */
  function initImageUpload() {
    const dropArea = document.getElementById('imageDropArea');
    const fileInput = document.getElementById('scheduleFileInput');

    dropArea.addEventListener('click', () => fileInput.click());

    dropArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropArea.classList.add('dragover');
    });

    dropArea.addEventListener('dragleave', () => {
      dropArea.classList.remove('dragover');
    });

    dropArea.addEventListener('drop', (e) => {
      e.preventDefault();
      dropArea.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });

    // デザイン参考画像A
    initSingleImageUpload('designRefDropA', 'designRefFileA', 'designRefPreviewA', 'A');
    // デザイン参考画像B
    initSingleImageUpload('designRefDropB', 'designRefFileB', 'designRefPreviewB', 'B');

    // テキストフィールドの入力監視
    const fields = ['customerName', 'accountId', 'productionContent', 'purpose', 'challenges', 'designRequest'];
    fields.forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', updateStatusPanel);
      }
    });

    // チェックボックスの変更監視
    const checkboxes = document.querySelectorAll('.scope-tag input[type="checkbox"]');
    checkboxes.forEach(cb => {
      cb.addEventListener('change', updateStatusPanel);
    });
  }

  /**
   * ファイルを処理してBase64に変換
   */
  function handleFiles(files) {
    for (const file of files) {
      if (!file.type.startsWith('image/')) continue;

      const reader = new FileReader();
      reader.onload = (e) => {
        scheduleImages.push(e.target.result);
        renderImagePreviews();
        updateNavDots();
        updateStatusPanel();
      };
      reader.readAsDataURL(file);
    }
  }

  /**
   * 画像プレビューを描画
   */
  function renderImagePreviews() {
    const container = document.getElementById('imagePreviewContainer');
    container.innerHTML = '';

    scheduleImages.forEach((img, index) => {
      const div = document.createElement('div');
      div.className = 'image-preview';
      div.innerHTML = `
        <img src="${img}" alt="スケジュール画像 ${index + 1}">
        <button class="remove-btn" onclick="removeImage(${index})">&times;</button>
      `;
      container.appendChild(div);
    });
  }

  /**
   * 画像を削除
   */
  function removeImage(index) {
    scheduleImages.splice(index, 1);
    renderImagePreviews();
    updateNavDots();
    updateStatusPanel();
  }

  /**
   * 単一画像アップロードエリアの初期化（デザイン参考用）
   */
  function initSingleImageUpload(dropId, fileInputId, previewId, label) {
    const drop = document.getElementById(dropId);
    const input = document.getElementById(fileInputId);
    if (!drop || !input) return;

    drop.addEventListener('click', () => input.click());

    drop.addEventListener('dragover', (e) => {
      e.preventDefault();
      drop.classList.add('dragover');
    });

    drop.addEventListener('dragleave', () => {
      drop.classList.remove('dragover');
    });

    drop.addEventListener('drop', (e) => {
      e.preventDefault();
      drop.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        handleDesignRefFile(e.dataTransfer.files[0], label, previewId);
      }
    });

    input.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleDesignRefFile(e.target.files[0], label, previewId);
      }
    });
  }

  /**
   * デザイン参考画像を処理
   */
  function handleDesignRefFile(file, label, previewId) {
    if (!file.type.startsWith('image/')) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      if (label === 'A') {
        designRefImageA = e.target.result;
      } else {
        designRefImageB = e.target.result;
      }
      renderDesignRefPreview(previewId, e.target.result, label);
      updateNavDots();
    };
    reader.readAsDataURL(file);
  }

  /**
   * デザイン参考画像プレビューを描画
   */
  function renderDesignRefPreview(previewId, imgData, label) {
    const container = document.getElementById(previewId);
    container.innerHTML = '';

    const div = document.createElement('div');
    div.className = 'image-preview';
    div.innerHTML = `
      <img src="${imgData}" alt="デザイン参考 ${label}">
      <button class="remove-btn" onclick="removeDesignRef('${label}', '${previewId}')">&times;</button>
    `;
    container.appendChild(div);
  }

  /**
   * デザイン参考画像を削除
   */
  function removeDesignRef(label, previewId) {
    if (label === 'A') {
      designRefImageA = null;
    } else {
      designRefImageB = null;
    }
    document.getElementById(previewId).innerHTML = '';
    updateNavDots();
  }

  /**
   * セクションへスクロール
   */
  function scrollToSection(sectionId) {
    const el = document.getElementById(sectionId);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ナビアイテムのアクティブ状態を更新
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    const clickedItem = document.querySelector(`a[href="#${sectionId}"]`);
    if (clickedItem) clickedItem.classList.add('active');
  }

  /**
   * サイドバーのナビゲーションドットを更新
   */
  function updateNavDots() {
    const hasBasic = document.getElementById('customerName').value.trim() &&
                     document.getElementById('productionContent').value.trim();
    const hasPurpose = document.getElementById('purpose').value.trim() ||
                       document.getElementById('challenges').value.trim();
    const hasDesign = document.getElementById('designRequest').value.trim() || designRefImageA || designRefImageB;
    const hasSchedule = scheduleImages.length > 0;
    const hasScope = document.querySelectorAll('.scope-tag input:checked').length > 0;

    setNavDot('navDotBasic', hasBasic ? 'done' : 'pending');
    setNavDot('navDotPurpose', hasPurpose ? 'done' : 'pending');
    setNavDot('navDotDesign', hasDesign ? 'done' : 'pending');
    setNavDot('navDotSchedule', hasSchedule ? 'done' : 'pending');
    setNavDot('navDotScope', hasScope ? 'done' : 'pending');
  }

  function setNavDot(id, state) {
    const dot = document.getElementById(id);
    if (!dot) return;
    dot.className = 'nav-dot ' + state;
  }

  /**
   * 右パネルのステータスを更新
   */
  function updateStatusPanel() {
    updateStatusItem('Customer', document.getElementById('customerName').value.trim());
    updateStatusItem('Content', document.getElementById('productionContent').value.trim());
    updateStatusItem('Purpose', document.getElementById('purpose').value.trim());
    updateStatusItem('Challenges', document.getElementById('challenges').value.trim());
    updateStatusItem('Design', document.getElementById('designRequest').value.trim());

    // スケジュール
    const schedDot = document.getElementById('statusDotSchedule');
    const schedVal = document.getElementById('statusValueSchedule');
    if (scheduleImages.length > 0) {
      schedDot.className = 'status-dot filled';
      schedVal.textContent = scheduleImages.length + '枚';
    } else {
      schedDot.className = 'status-dot empty';
      schedVal.textContent = '未添付';
    }

    // 役務範囲
    const scopeChecked = document.querySelectorAll('.scope-tag input:checked').length;
    const scopeDot = document.getElementById('statusDotScope');
    const scopeVal = document.getElementById('statusValueScope');
    if (scopeChecked > 0) {
      scopeDot.className = 'status-dot filled';
      scopeVal.textContent = scopeChecked + '項目';
    } else {
      scopeDot.className = 'status-dot empty';
      scopeVal.textContent = '未選択';
    }
  }

  function updateStatusItem(name, value) {
    const dot = document.getElementById('statusDot' + name);
    const val = document.getElementById('statusValue' + name);
    if (!dot || !val) return;

    if (value) {
      dot.className = 'status-dot filled';
      val.textContent = value.length > 8 ? value.substring(0, 8) + '...' : value;
    } else {
      dot.className = 'status-dot empty';
      val.textContent = '未入力';
    }
  }

  /**
   * フォームデータを収集する
   */
  function collectFormData() {
    return {
      customerName: document.getElementById('customerName').value,
      accountId: document.getElementById('accountId').value,
      productionContent: document.getElementById('productionContent').value,
      purpose: document.getElementById('purpose').value,
      challenges: document.getElementById('challenges').value,
      designRequest: document.getElementById('designRequest').value,
      designRefImageA: designRefImageA,
      designRefImageB: designRefImageB,
      scheduleImages: scheduleImages,
      implementationPeriod: document.getElementById('implementationPeriod').value,
      revisionPeriod: document.getElementById('revisionPeriod').value,
      siteCheckPeriod: document.getElementById('siteCheckPeriod').value,
      wfUrl: document.getElementById('wfUrl').value,
      scope: {
        structureProposal: document.getElementById('scopeStructure').checked,
        designCreation: document.getElementById('scopeDesign').checked,
        designProvided: document.getElementById('scopeDesignProvided').checked,
        implementation: document.getElementById('scopeImplementation').checked,
        copyCreation: document.getElementById('scopeCopy').checked,
        copyProvided: document.getElementById('scopeCopyProvided').checked,
        siteCopy: document.getElementById('scopeSiteCopy').checked,
        javascript: document.getElementById('scopeJavascript').checked,
      },
    };
  }

  /**
   * バリデーション
   */
  function validateForm() {
    const checks = [
      { id: 'customerName', label: '顧客名' },
      { id: 'productionContent', label: '制作内容' },
    ];
    for (const check of checks) {
      const el = document.getElementById(check.id);
      if (!el.value.trim()) {
        el.focus();
        el.style.borderColor = '#EF4444';
        el.style.boxShadow = '0 0 0 3px rgba(239, 68, 68, 0.1)';
        setTimeout(() => {
          el.style.borderColor = '';
          el.style.boxShadow = '';
        }, 3000);
        showToast(check.label + 'を入力してください', 'error');
        return false;
      }
    }
    return true;
  }

  /**
   * トースト通知
   */
  function showToast(message, type) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.style.cssText = `
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      z-index: 2000;
      animation: toastIn 0.3s ease;
      font-family: inherit;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      ${type === 'error'
        ? 'background: #FEF2F2; color: #EF4444; border: 1px solid rgba(239,68,68,0.2);'
        : 'background: #ECFDF5; color: #10B981; border: 1px solid rgba(16,185,129,0.2);'}
    `;
    toast.textContent = message;
    document.body.appendChild(toast);

    // アニメーション用style
    if (!document.getElementById('toastStyle')) {
      const style = document.createElement('style');
      style.id = 'toastStyle';
      style.textContent = `
        @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(12px); } }
      `;
      document.head.appendChild(style);
    }

    setTimeout(() => {
      toast.style.animation = 'toastOut 0.3s ease forwards';
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  }

  /**
   * プレビュー生成
   */
  function generatePreview() {
    if (!validateForm()) return;

    const formData = collectFormData();
    showLoading('AIでテキストを生成しています', 'メモ内容をプロフェッショナルなビジネス文書に整形中...');

    google.script.run
      .withSuccessHandler(handlePreviewSuccess)
      .withFailureHandler(handleError)
      .generatePreview(formData);
  }

  /**
   * プレビュー成功時のハンドラ
   */
  function handlePreviewSuccess(result) {
    hideLoading();

    if (!result.success) {
      showError(result.error);
      return;
    }

    const preview = result.preview;
    const section = document.getElementById('previewSection');
    section.classList.add('active');

    document.getElementById('previewPurpose').textContent = preview.purpose || '';
    const goals = [preview.goal01, preview.goal02, preview.goal03].filter(Boolean).join('\n');
    document.getElementById('previewGoals').textContent = goals || '（未生成）';
    const challenges = [preview.challenge01, preview.challenge02, preview.challenge03].filter(Boolean).join('\n');
    document.getElementById('previewChallenges').textContent = challenges || '（未生成）';
    document.getElementById('previewDesignA').textContent =
      (preview.designImageA_summary ? preview.designImageA_summary + '\n' + (preview.designImageA_detail || '') : '（未生成）');
    document.getElementById('previewDesignB').textContent =
      (preview.designImageB_summary ? preview.designImageB_summary + '\n' + (preview.designImageB_detail || '') : '（未生成）');
    document.getElementById('previewSchedule').textContent = preview.scheduleText || '（画像未添付）';

    section.scrollIntoView({ behavior: 'smooth' });
    showToast('プレビューを生成しました', 'success');
  }

  /**
   * スライド生成を実行
   */
  function submitForm() {
    if (!validateForm()) return;
    showConfirm();
  }

  /**
   * 確認ダイアログ表示
   */
  function showConfirm() {
    document.getElementById('confirmOverlay').classList.add('active');
  }

  function hideConfirm() {
    document.getElementById('confirmOverlay').classList.remove('active');
  }

  /**
   * 確認後にスライド生成を実行
   */
  function confirmSubmit() {
    hideConfirm();

    const formData = collectFormData();
    showLoading('制作MTG資料を生成中', 'OpenAI によるテキスト生成とGoogle Slides資料の作成を行っています');

    google.script.run
      .withSuccessHandler(handleSubmitSuccess)
      .withFailureHandler(handleError)
      .processForm(formData);
  }

  /**
   * 送信成功時のハンドラ
   */
  function handleSubmitSuccess(result) {
    hideLoading();

    const resultSection = document.getElementById('resultSection');
    resultSection.classList.add('active');

    if (result.success) {
      resultSection.innerHTML = `
        <div class="card">
          <div class="result-success">
            <svg viewBox="0 0 24 24" width="48" height="48" stroke="#10B981" fill="none" stroke-width="1.5" style="margin-bottom: 12px;">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke-linecap="round" stroke-linejoin="round"/>
              <polyline points="22 4 12 14.01 9 11.01" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h3>資料の生成が完了しました</h3>
            <a href="${result.slideUrl}" target="_blank">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="1.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              Google Slides で開く
            </a>
          </div>
        </div>
      `;
      showToast('スライドが生成されました', 'success');
    } else {
      showError(result.error);
    }

    resultSection.scrollIntoView({ behavior: 'smooth' });
  }

  /**
   * エラーハンドラ
   */
  function handleError(error) {
    hideLoading();
    showError(error.message || 'エラーが発生しました。');
  }

  /**
   * エラー表示
   */
  function showError(message) {
    const resultSection = document.getElementById('resultSection');
    resultSection.classList.add('active');
    resultSection.innerHTML = `
      <div class="card">
        <div class="result-error">
          <strong>エラーが発生しました</strong>
          <p style="margin-top: 8px;">${message}</p>
        </div>
      </div>
    `;
    resultSection.scrollIntoView({ behavior: 'smooth' });
  }

  /**
   * ローディング表示
   */
  function showLoading(title, message) {
    const overlay = document.getElementById('loadingOverlay');
    const titleEl = overlay.querySelector('.loading-title');
    const textEl = document.getElementById('loadingText');
    if (titleEl) titleEl.textContent = title;
    if (textEl) textEl.textContent = message;
    overlay.classList.add('active');
  }

  /**
   * ローディング非表示
   */
  function hideLoading() {
    document.getElementById('loadingOverlay').classList.remove('active');
  }

  // ファビコンを動的に設定（GAS iframe内でも親フレームに反映を試みる）
  (function() {
    var canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FF7E47';
    ctx.beginPath();
    ctx.roundRect(0, 0, 32, 32, 6);
    ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 20px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('M', 16, 17);
    var link = document.querySelector("link[rel*='icon']") || document.createElement('link');
    link.type = 'image/png';
    link.rel = 'icon';
    link.href = canvas.toDataURL('image/png');
    document.head.appendChild(link);
    try {
      if (window.parent && window.parent.document) {
        var parentLink = window.parent.document.querySelector("link[rel*='icon']") || window.parent.document.createElement('link');
        parentLink.type = 'image/png';
        parentLink.rel = 'icon';
        parentLink.href = canvas.toDataURL('image/png');
        window.parent.document.head.appendChild(parentLink);
      }
    } catch(e) { /* cross-origin制約の場合は無視 */ }
  })();

  // ページ読み込み時に初期化
  document.addEventListener('DOMContentLoaded', init);
</script>
