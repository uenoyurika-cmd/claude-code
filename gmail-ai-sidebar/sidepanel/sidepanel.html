<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ビジネスメール アシスタント</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- 設定画面 -->
  <div id="settings-screen" class="screen">
    <div class="settings-container">
      <div class="settings-icon-large">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <h1 class="settings-title">ビジネスメール<br>アシスタント</h1>
      <p class="settings-subtitle">AIがあなたの文章を丁寧な<br>ビジネスメールに変換します</p>

      <div class="settings-form">
        <label class="input-label" for="api-key-input">Gemini API キー</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="api-key-input"
            placeholder="AIza..."
            autocomplete="off"
          >
          <button id="toggle-key-visibility" class="icon-btn-small" title="表示/非表示">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <label class="input-label" for="user-name-input">あなたの名前</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="user-name-input"
            placeholder="例: 山田 太郎"
            autocomplete="off"
          >
        </div>

        <label class="input-label" for="greeting-select">冒頭の挨拶</label>
        <div class="select-wrapper">
          <select id="greeting-select">
            <option value="お疲れ様です。" selected>お疲れ様です。（社内向け）</option>
            <option value="いつもお世話になっております。">いつもお世話になっております。（社外向け）</option>
            <option value="お忙しいところ恐れ入ります。">お忙しいところ恐れ入ります。（丁寧）</option>
            <option value="">なし（AIにおまかせ）</option>
          </select>
        </div>

        <label class="input-label" for="model-select">モデル選択</label>
        <div class="select-wrapper">
          <select id="model-select">
            <option value="gemini-2.5-pro-preview-05-06">Gemini 2.5 Pro（最高品質）</option>
            <option value="gemini-2.5-flash-preview-05-20">Gemini 2.5 Flash（高性能）</option>
            <option value="gemini-2.5-flash-lite" selected>Gemini 2.5 Flash Lite（高速・低コスト）</option>
          </select>
        </div>

        <button id="save-settings-btn" class="btn-primary">はじめる</button>
      </div>
    </div>
  </div>

  <!-- チャット画面 -->
  <div id="chat-screen" class="screen hidden">
    <!-- ヘッダー -->
    <header id="header">
      <div class="header-left">
        <div class="header-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <h1 class="header-title">メール アシスタント</h1>
      </div>
      <button id="open-settings-btn" class="icon-btn" title="設定">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </header>

    <!-- メッセージエリア -->
    <div id="messages">
      <div class="welcome-card">
        <div class="welcome-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
        <h2>ようこそ</h2>
        <p>メールにしたい内容を下のテキストエリアに入力してください。AIが丁寧なビジネスメールに変換します。</p>
        <div class="example-chips">
          <button class="chip" data-text="明日の会議を来週に変更したい。急な案件が入ったので。">会議の日程変更</button>
          <button class="chip" data-text="納期に間に合わなさそう。あと3日ほしい。">納期の延長依頼</button>
          <button class="chip" data-text="先日のプレゼンありがとうございました。とても参考になりました。今後もよろしく。">お礼のメール</button>
        </div>
      </div>
    </div>

    <!-- 入力エリア -->
    <div id="input-area">
      <div class="textarea-wrapper">
        <textarea
          id="message-input"
          placeholder="メールにしたい内容を入力..."
          rows="3"
        ></textarea>
      </div>
      <div class="input-actions">
        <span class="input-hint">Enter で改行</span>
        <button id="send-btn" class="btn-send" title="送信">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
