<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Bookmark Manager+</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="manager-body">
  <div class="manager-container">
    <!-- Circuit overlay background for header -->
    <div class="circuit-overlay circuit-overlay-header"></div>

    <header class="manager-header">
      <div class="header-brand">
        <span class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>
          </svg>
        </span>
        <h1>Bookmark Manager<span class="accent-plus">+</span></h1>
      </div>
      <div class="header-actions">
        <div class="search-bar search-bar-wide">
          <div class="search-wrapper">
            <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <input type="text" id="searchInput" placeholder="ブックマークを検索... (Ctrl+F)">
          </div>
        </div>
        <div class="view-toggle">
          <button id="viewTree" class="btn-view active" title="ツリー表示">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M1 2h14v1H1zm2 3h12v1H3zm2 3h10v1H5zm-2 3h12v1H3zm-2 3h14v1H1z"/>
            </svg>
          </button>
          <button id="viewGrid" class="btn-view" title="グリッド表示">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M1 1h6v6H1zm8 0h6v6H9zM1 9h6v6H1zm8 0h6v6H9z"/>
            </svg>
          </button>
        </div>

        <!-- Dock Position Selector in header -->
        <div class="dock-selector-inline">
          <button class="dock-btn" data-position="left" title="左端に固定">
            <svg width="14" height="14" viewBox="0 0 16 16"><rect x="0" y="1" width="5" height="14" rx="1" fill="currentColor"/><rect x="7" y="1" width="9" height="14" rx="1" fill="currentColor" opacity="0.2"/></svg>
          </button>
          <button class="dock-btn" data-position="top" title="上端に固定">
            <svg width="14" height="14" viewBox="0 0 16 16"><rect x="1" y="0" width="14" height="5" rx="1" fill="currentColor"/><rect x="1" y="7" width="14" height="9" rx="1" fill="currentColor" opacity="0.2"/></svg>
          </button>
          <button class="dock-btn active" data-position="center" title="中央">
            <svg width="14" height="14" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1" fill="currentColor"/><rect x="0" y="0" width="16" height="16" rx="1" fill="currentColor" opacity="0.1"/></svg>
          </button>
          <button class="dock-btn" data-position="bottom" title="下端に固定">
            <svg width="14" height="14" viewBox="0 0 16 16"><rect x="1" y="0" width="14" height="9" rx="1" fill="currentColor" opacity="0.2"/><rect x="1" y="11" width="14" height="5" rx="1" fill="currentColor"/></svg>
          </button>
          <button class="dock-btn" data-position="right" title="右端に固定">
            <svg width="14" height="14" viewBox="0 0 16 16"><rect x="0" y="1" width="9" height="14" rx="1" fill="currentColor" opacity="0.2"/><rect x="11" y="1" width="5" height="14" rx="1" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Wave divider under header -->
    <div class="wave-divider wave-divider-wide">
      <svg viewBox="0 0 1200 16" preserveAspectRatio="none">
        <path d="M0,8 C150,0 300,16 600,8 C900,0 1050,16 1200,8 L1200,16 L0,16 Z" fill="var(--bg-primary)"/>
      </svg>
    </div>

    <div class="manager-layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8l-2-2z"/></svg>
          フォルダ
        </div>
        <div id="folderTree" class="folder-tree"></div>
        <button id="addFolder" class="btn-sidebar">+ 新しいフォルダ</button>
      </aside>

      <main class="main-content">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div id="bookmarkTree" class="bookmark-tree"></div>
      </main>
    </div>

    <!-- Context Menu -->
    <div id="contextMenu" class="context-menu hidden">
      <button data-action="open">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        開く
      </button>
      <button data-action="openNewTab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8m-4-4h8"/></svg>
        新しいタブで開く
      </button>
      <hr>
      <button data-action="edit">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        編集
      </button>
      <button data-action="move">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
        移動
      </button>
      <hr>
      <button data-action="delete" class="context-danger">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        削除
      </button>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <h2 id="modalTitle">ブックマークを編集</h2>
        <div class="form-group">
          <label for="editName">名前</label>
          <input type="text" id="editName">
        </div>
        <div class="form-group" id="urlGroup">
          <label for="editUrl">URL</label>
          <input type="text" id="editUrl">
        </div>
        <div class="form-group" id="parentGroup">
          <label for="editParent">移動先フォルダ</label>
          <select id="editParent"></select>
        </div>
        <div class="modal-actions">
          <button id="modalCancel" class="btn-ghost btn-pill">キャンセル</button>
          <button id="modalSave" class="btn-primary btn-pill">保存</button>
        </div>
      </div>
    </div>
  </div>
  <script src="bookmarks.js"></script>
  <script src="manager.js"></script>
</body>
</html>
